name: smartwerk-marketing-production

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartwerk_marketing
      POSTGRES_USER: smartwerk
      POSTGRES_PASSWORD: ${MARKETING_DB_PASSWORD:?Production database password is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwerk -d smartwerk_marketing"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: marketing/Dockerfile
    image: smartwerk-marketing:production
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      MARKETING_MEDIA_DIR: /app/marketing/var/media
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - media-data:/app/marketing/var/media
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  media-data:
