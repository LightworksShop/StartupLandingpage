server {
    server_name smartwerk-software.de www.smartwerk-software.de;

    if ($host = www.smartwerk-software.de) {
        return 301 https://smartwerk-software.de$request_uri;
    }

    root /var/www/landingpage;
    index index.html;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        return 301 https://smartwerk-software.de/;
    }

    # Marketing runs outside the public website directory.
    location ~ ^/(marketing(?:/|$)|marketing-assets(?:/|$)|marketing-media(?:/|$)|api/marketing(?:-agent)?(?:/|$)|custom/marketing-oauth(?:/|$)) {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 22m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 420s;
        proxy_send_timeout 60s;
    }

    # Only website assets are public; repository and configuration files are not.
    location ~ (^|/)\. {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location ~ ^/(404\.html|impressum\.html|datenschutz\.html|app\.js|content\.js|legal\.js|styles\.css|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/smartwerk-software.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartwerk-software.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartwerk-software.de www.smartwerk-software.de;
    return 301 https://smartwerk-software.de$request_uri;
}
